<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, ~{::scripts})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Admin Dashboard</h3>
        <a th:href="@{/admin/doctors/new}" class="btn btn-primary btn-sm">
            <i class="bi bi-person-plus me-1"></i>Add Doctor
        </a>
    </div>

    <!-- Stats row -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm bg-primary text-white">
                <div class="card-body d-flex justify-content-between align-items-center py-3">
                    <div>
                        <p class="mb-0 opacity-75 small">Doctors</p>
                        <h3 class="fw-bold mb-0" th:text="${totalDoctors}">0</h3>
                    </div>
                    <i class="bi bi-person-badge" style="font-size:2.2rem;opacity:.4"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm bg-success text-white">
                <div class="card-body d-flex justify-content-between align-items-center py-3">
                    <div>
                        <p class="mb-0 opacity-75 small">Total Users</p>
                        <h3 class="fw-bold mb-0" th:text="${totalPatients}">0</h3>
                    </div>
                    <i class="bi bi-people" style="font-size:2.2rem;opacity:.4"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm bg-warning">
                <div class="card-body d-flex justify-content-between align-items-center py-3">
                    <div>
                        <p class="mb-0 opacity-50 small">Confirmed</p>
                        <h3 class="fw-bold mb-0" th:text="${confirmedAppointments}">0</h3>
                    </div>
                    <i class="bi bi-calendar-check" style="font-size:2.2rem;opacity:.3"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm bg-info text-white">
                <div class="card-body d-flex justify-content-between align-items-center py-3">
                    <div>
                        <p class="mb-0 opacity-75 small">Completed</p>
                        <h3 class="fw-bold mb-0" th:text="${completedAppointments}">0</h3>
                    </div>
                    <i class="bi bi-check2-circle" style="font-size:2.2rem;opacity:.4"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Recent appointments -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 py-3">
                    <h5 class="mb-0 fw-semibold">Recent Appointments</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Patient</th>
                                <th>Doctor</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Notes</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="appt : ${recentAppointments}">
                                <td th:text="${appt.patient.fullName}"></td>
                                <td class="small" th:text="${appt.doctor.user.fullName}"></td>
                                <td class="small" th:text="${appt.appointmentDate}"></td>
                                <td class="small" th:text="${appt.appointmentTime}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${appt.status.name() == 'CONFIRMED'}  ? 'bg-success' :
                                                          (${appt.status.name() == 'COMPLETED'} ? 'bg-primary' :
                                                          (${appt.status.name() == 'CANCELLED'} ? 'bg-danger'  : 'bg-secondary'))"
                                          th:text="${appt.status}"></span>
                                </td>
                                <td>
                                    <span th:if="${appt.consultationNotes != null}"
                                          class="text-muted small" style="max-width:160px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"
                                          th:text="${appt.consultationNotes}"
                                          th:title="${appt.consultationNotes}"></span>
                                    <span th:unless="${appt.consultationNotes != null}" class="text-muted small">—</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Doctor leave log -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 py-3">
                    <h5 class="mb-0 fw-semibold"><i class="bi bi-calendar-x text-danger me-2"></i>Doctor Leaves</h5>
                    <small class="text-muted">Upcoming blocked dates</small>
                </div>
                <div class="card-body p-0">
                    <div th:if="${doctorLeaves.empty}" class="text-center py-4 text-muted">
                        <i class="bi bi-calendar-check" style="font-size:2rem"></i>
                        <p class="small mt-2 mb-0">All doctors available</p>
                    </div>
                    <div th:unless="${doctorLeaves.empty}" class="list-group list-group-flush">
                        <div th:each="leave : ${doctorLeaves}"
                             class="list-group-item border-0 py-2 px-3">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <div class="fw-semibold small" th:text="${leave.doctor.user.fullName}"></div>
                                    <div class="text-muted" style="font-size:.75rem" th:text="${leave.leaveDate}"></div>
                                </div>
                                <div class="text-end">
                                    <div class="text-muted small" th:text="${leave.reason ?: 'No reason'}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
