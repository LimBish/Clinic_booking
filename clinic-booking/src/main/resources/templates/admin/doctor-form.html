<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, ~{::scripts})}">
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center mb-4 gap-3">
        <a th:href="@{/admin/doctors}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h3 class="fw-bold mb-0">Add New Doctor</h3>
            <p class="text-muted mb-0 small">Create a doctor account with login credentials</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <!-- Inline error banner (e.g. duplicate email) -->
                    <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 mb-4">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/admin/doctors}" th:object="${doctorRequest}" method="post" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{fullName}"
                                       placeholder="Dr. Jane Smith" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" th:field="*{email}"
                                       placeholder="doctor@clinic.com" required/>
                                <div class="form-text">Used to log in to the system</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Temporary Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" th:field="*{password}"
                                       placeholder="Min 6 characters" required minlength="6"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone</label>
                                <input type="text" class="form-control" th:field="*{phone}"
                                       placeholder="+1 234 567 8900"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Specialization</label>
                                <select class="form-select" th:field="*{specialization}">
                                    <option value="">— Select specialization —</option>
                                    <option th:each="s : ${specializations}" th:value="${s}"
                                            th:text="${#strings.replace(s.name(), '_', ' ')}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Consultation Fee ($)</label>
                                <div class="input-group">
                                    <span class="input-group-text">Rs</span>
                                    <input type="number" class="form-control" th:field="*{consultationFee}"
                                           min="0" placeholder="0"/>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Bio</label>
                                <textarea class="form-control" th:field="*{bio}" rows="3"
                                          placeholder="Brief professional background..."></textarea>
                            </div>
                        </div>

                        <hr class="my-4"/>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-person-plus me-2"></i>Add Doctor
                            </button>
                            <a th:href="@{/admin/doctors}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm bg-info bg-opacity-10">
                <div class="card-body">
                    <h6 class="fw-semibold mb-2"><i class="bi bi-info-circle text-info me-2"></i>Tips</h6>
                    <ul class="small text-muted mb-0 ps-3">
                        <li>The doctor will use the email and password to log in</li>
                        <li>You can set their availability schedule after creating their account</li>
                        <li>Inactive doctors won't appear in patient booking</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
