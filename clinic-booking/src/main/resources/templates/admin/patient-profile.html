<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, ~{::scripts})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0">Patient Profile</h3>
        <a th:href="@{/admin/patients}" class="btn btn-outline-secondary btn-sm">Back to Patients</a>
    </div>

    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="text-muted small">Name</div>
                    <div class="fw-semibold" th:text="${patient.fullName}"></div>
                </div>
                <div class="col-md-4">
                    <div class="text-muted small">Email</div>
                    <div class="fw-semibold" th:text="${patient.email}"></div>
                </div>
                <div class="col-md-4">
                    <div class="text-muted small">Registration date</div>
                    <div class="fw-semibold" th:text="${patient.createdAt != null ? #temporals.format(patient.createdAt, 'yyyy-MM-dd HH:mm') : '—'}"></div>
                </div>
                <div class="col-md-4">
                    <div class="text-muted small">Status</div>
                    <span class="badge" th:classappend="${patient.enabled} ? 'bg-success' : 'bg-secondary'"
                          th:text="${patient.enabled} ? 'ACTIVE' : 'BLOCKED'"></span>
                </div>
                <div class="col-md-8 text-md-end">
                    <form method="post" th:action="@{/admin/patients/{id}/toggle(id=${patient.id})}" class="d-inline">
                        <input type="hidden" name="back" value="profile"/>
                        <button class="btn"
                                th:classappend="${patient.enabled} ? 'btn-outline-danger' : 'btn-outline-success'"
                                th:text="${patient.enabled} ? 'Deactivate / Block Patient' : 'Activate Patient'"></button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 py-3">
            <h5 class="mb-0 fw-semibold">Appointment History</h5>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Doctor</th>
                    <th>Status</th>
                    <th>Reason</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${appointments.empty}">
                    <td colspan="5" class="text-center text-muted py-4">No appointments yet</td>
                </tr>
                <tr th:each="appt : ${appointments}">
                    <td th:text="${appt.appointmentDate}"></td>
                    <td th:text="${appt.appointmentTime}"></td>
                    <td th:text="${appt.doctor.user.fullName}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${appt.status.name() == 'CONFIRMED'}  ? 'bg-success' :
                                              (${appt.status.name() == 'COMPLETED'} ? 'bg-primary' :
                                              (${appt.status.name() == 'CANCELLED'} ? 'bg-danger'  : 'bg-secondary'))"
                              th:text="${appt.status}"></span>
                    </td>
                    <td th:text="${appt.reason ?: '—'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<th:block th:fragment="scripts"></th:block>
</body>
</html>
