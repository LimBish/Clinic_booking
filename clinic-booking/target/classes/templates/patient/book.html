<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, ~{::scripts})}">
<body>

<div th:fragment="content">
    <h3 class="fw-bold mb-1">Book an Appointment</h3>
    <p class="text-muted mb-4">Select a doctor and an available time slot</p>

    <!-- Specialization filter -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body py-3">
            <form th:action="@{/patient/book}" method="get" class="d-flex align-items-end gap-3">
                <div class="flex-grow-1" style="max-width:320px">
                    <label class="form-label fw-semibold small mb-1">Filter by Specialization</label>
                    <select name="specialization" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option value="" th:selected="${param.specialization == null || param.specialization[0] == ''}">
                            All Specializations
                        </option>
                        <option th:each="s : ${specializations}"
                                th:value="${s}"
                                th:selected="${param.specialization != null && param.specialization[0] == s.toString()}"
                                th:text="${#strings.replace(s.name(), '_', ' ')}">
                        </option>
                    </select>
                </div>
            </form>
        </div>
    </div>

    <div id="booking-app"></div>

    <!-- Server -> JS constants -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const DOCTORS_DATA = /*[[${doctorsJson}]]*/ '[]';
        const BOOK_URL     = /*[[@{/patient/book}]]*/ '/patient/book';
        const SLOTS_URL    = /*[[@{/patient/api/slots}]]*/ '/patient/api/slots';
        const AVAIL_URL    = /*[[@{/patient/api/doctor-availability}]]*/ '/patient/api/doctor-availability';
        /*]]>*/
    </script>
</div>

<th:block th:fragment="scripts">
    <script type="text/babel" th:src="@{/js/patient-booking.js}"></script>
</th:block>

</body>
</html>
